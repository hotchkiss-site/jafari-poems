name: Build collection

on:
  push:
    branches: [main]
    paths:
      - "poems/**.poem"
      - "meta/**.toml"
      - "preface/**.html"
      - "build_collection.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build index.html
        run: python build_collection.py poems/

      - name: Commit and push index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: rebuild index.html [skip ci]"
          git push
